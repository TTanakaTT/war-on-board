# Implements an agreed specification and opens a pull request when a human adds
# the `ready-for-dev` label to an issue. Only the issue title and body are passed
# to Claude; comments are not read. Claude cannot merge pull requests.
name: Issue to PR

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Implement with Claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement the agreed specification below for issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            The issue title and body, plus the prototype branch the body names, are the only sources of the specification. Do not read issue comments.

            <issue_title>
            ${{ github.event.issue.title }}
            </issue_title>

            <issue_body>
            ${{ github.event.issue.body }}
            </issue_body>

            Steps:
            1. Create the implementation branch named `<feat|fix|refactor|chore>/issue-${{ github.event.issue.number }}-<short-kebab-summary>`:
               - If the body names a prototype branch (`proto/...`), fetch it, create the branch from it, and merge `origin/main` into it.
               - Otherwise, create the branch from main.
            2. Implement following CLAUDE.md and docs/ARCHITECTURE.md:
               - With a prototype branch, the prototype is the source of truth for look and behavior. Keep its visual output and behavior exactly as they are. Only remove leftovers marked `PROTOTYPE ONLY`, bring the code up to the project rules without changing what the user sees, implement what `## 仕様` adds beyond the prototype, and add the tests it lists.
               - Without a prototype branch, implement `## 仕様` and add the tests it lists.
               - If `## 仕様` contradicts the prototype, the prototype takes precedence.
            3. Commit the changes following `.claude/skills/commit/SKILL.md`.
            4. Open the pull request following `.claude/skills/pull-request/SKILL.md`.
               The pull request body must include `Closes #${{ github.event.issue.number }}`.

            Never merge pull requests and never push to main.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue comment:*)"
